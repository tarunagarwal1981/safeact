[project]
name = "safeact"
version = "0.1.0"
description = "At-most-once side effects for AI agents that crash and retry. One decorator, one Saga, a SQLite file."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tarun Agarwal" }]
keywords = [
    "ai", "agents", "idempotency", "exactly-once", "at-most-once",
    "durable-execution", "saga", "reliability", "llm", "tool-use",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []  # standard library only — sqlite3 is stdlib

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
# safeact.ai is not live yet — point at the working GitHub Pages site so the PyPI
# "Homepage" link is never dead. Switch to https://safeact.ai in a later release
# once the domain resolves.
Homepage = "https://tarunagarwal1981.github.io/safeact/"
Repository = "https://github.com/tarunagarwal1981/safeact"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["safeact"]

[tool.pytest.ini_options]
# put the project root on sys.path so `import safeact` resolves without an install
pythonpath = ["."]
testpaths = ["tests"]
